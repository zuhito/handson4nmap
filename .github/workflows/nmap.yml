name: nmap

on: [push, workflow_dispatch]

jobs:
  scan:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/devcontainers/universal:2-linux
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install.sh
      - name: Core scans
        run: bash tests/core.sh
      - name: PROFINET (p-net)
        run: bash scripts/pnet-check.sh
      - name: PROFINET (scapy)
        run: bash scripts/profinet-check.sh
      - name: MQTT subscribe
        run: bash tests/mqtt-subscribe.sh
      - name: OpenVPN
        run: bash tests/openvpn.sh
      - name: CoDeSys
        run: bash tests/codesys.sh
      - name: SNMP
        run: bash tests/snmp.sh
      - name: NTP
        run: bash tests/ntp.sh
      - name: HTML report
        run: bash tests/report.sh

  dhcp:
    # Network namespaces cannot be created inside the container used above,
    # so the DHCP checks run directly on the runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nmap dnsmasq-base
      - name: DHCP
        run: sudo bash scripts/dhcp-check.sh
