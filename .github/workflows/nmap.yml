name: nmap

on: [push, workflow_dispatch]

jobs:
  scan:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/devcontainers/universal:2-linux
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: bash scripts/install.sh
      - name: Build nmap
        run: bash scripts/nmap-build.sh
      - name: Fetch codesys NSE
        run: bash scripts/codesys-nse.sh
      - name: Build busybox
        run: bash scripts/busybox-build.sh
      - name: Install Grafana
        run: bash scripts/grafana-install.sh
      - name: PHP is 8.1 or newer
        run: |
          php -r 'exit(PHP_VERSION_ID >= 80100 ? 0 : 1);'
      - name: unzip is available
        run: command -v unzip
      - name: Install OpenCart
        run: bash scripts/opencart-install.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Core scans
        run: bash tests/core.sh
      - name: PROFINET (scapy)
        run: bash scripts/profinet-check.sh
      - name: MQTT subscribe
        run: bash tests/mqtt-subscribe.sh
      - name: CoDeSys
        run: bash tests/codesys.sh
      - name: SNMP
        run: bash tests/snmp.sh
      - name: NTP
        run: bash tests/ntp.sh
      - name: Grafana
        run: bash tests/grafana.sh
      - name: InfluxDB
        run: bash tests/influxdb.sh
      - name: OpenCart
        run: bash tests/opencart.sh
      - name: VNC
        run: bash tests/vnc.sh
      - name: IMAP
        run: bash tests/imap.sh
      - name: POP3
        run: bash tests/pop3.sh
      - name: DNS
        run: bash tests/dns.sh
      - name: SMTP
        run: bash tests/smtp.sh
      - name: MySQL
        run: bash tests/mysql.sh
      - name: SSH
        run: bash tests/ssh.sh
      - name: HTML report
        run: bash tests/report.sh
      - name: README commands
        run: bash tests/readme.sh

  dhcp:
    # Network namespaces cannot be created inside the container used above,
    # so the DHCP checks run directly on the runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nmap dnsmasq-base
      - name: DHCP
        run: sudo bash scripts/dhcp-check.sh

  openvpn:
    # The container has no /dev/net/tun, so OpenVPN is exercised on the runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nmap openvpn
      - name: OpenVPN
        run: |
          sudo bash scripts/openvpn-keys.sh
          sudo bash scripts/openvpn-start.sh
          sudo bash tests/openvpn.sh
