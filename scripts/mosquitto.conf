listener 1883
allow_anonymous true
persistence false

# Everything in this container runs as root, so the broker must not drop
# privileges or it cannot read the password file.
user root
password_file /tmp/mosquitto.pw
acl_file scripts/mosquitto.acl

# Without this the broker publishes dozens of $SYS statistics topics, which
# drowns out the device topics in the mqtt-subscribe output.
sys_interval 0
